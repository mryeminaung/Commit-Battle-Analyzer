<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Put two GitHub profiles head-to-head on a retro scoreboard. Power, activity, reach — who wins?"
    />
    <meta name="theme-color" content="#14161A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commit Battle Analyzer" />
    <meta property="og:title" content="Commit Battle Analyzer — GitHub profile battles" />
    <meta
      property="og:description"
      content="Linus vs Dan. Vue vs Svelte. Settle it on public GitHub signals — repos, followers, activity — on a retro scoreboard."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Commit Battle Analyzer scoreboard preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commit Battle Analyzer — GitHub profile battles" />
    <meta
      name="twitter:description"
      content="Who wins on public GitHub signals? Battle of the week, shareable links, retro scoreboard."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Commit Battle Analyzer</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cba:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
